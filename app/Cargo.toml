[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
# JSON-Verarbeitung
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Kryptographie
aes-gcm = "0.10"
rand = "0.8"

# Netzwerk
ureq = { version = "3.4", features = ["native-tls"] }

# Windows-spezifische APIs (Native WiFi API)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Networking_NetworkListManager", "Win32_System_Com"] }

# macOS-spezifische APIs (CoreWLAN Bindings)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-core-wlan = "0.2.2"
objc2-foundation = "0.2.2"

# Linux-spezifische APIs (D-Bus Schnittstelle zum NetworkManager)
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4.0"
