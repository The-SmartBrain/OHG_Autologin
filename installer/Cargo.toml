[package]
name = "ohg-wlan-installer"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "ohg-wlan-installer"
path = "src/main.rs"

[dependencies]
eframe = "0.33"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
