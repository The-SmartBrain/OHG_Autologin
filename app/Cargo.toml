[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssid = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"]}
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
slint = "1.18.1"

[build-dependencies]
slint-build = "1.18.1"
